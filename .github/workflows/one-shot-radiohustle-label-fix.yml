name: One-shot Radio Hustle label fix

on:
  push:
    paths:
      - .github/workflows/one-shot-radiohustle-label-fix.yml

permissions:
  contents: write

jobs:
  fix-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/add-radiohustle-profile-20261014
          fetch-depth: 0

      - name: Preserve source abbreviation exactly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('data/anton_nazarov_profile.json')
          text = path.read_text(encoding='utf-8')
          old = 'competitive Hustle / Discofox dancer; ASC #11713, verified Radio Hustle profile'
          new = 'competitive Hustle / Discofox dancer; АСХ #11713, verified Radio Hustle profile'
          if old not in text:
              raise SystemExit('Expected Radio Hustle label not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit label fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-radiohustle-label-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anton_nazarov_profile.json .github/workflows/one-shot-radiohustle-label-fix.yml
          git diff --cached --quiet || git commit -m "Use exact ASH label for Radio Hustle profile"
          git push origin HEAD:chore/add-radiohustle-profile-20261014
