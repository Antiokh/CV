name: Sync public CV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: cv-public-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HAS_WORKSPACE_PAT: ${{ secrets.CV_WORKSPACE_PAT != '' }}
    steps:
      - name: Explain missing credentials
        if: env.HAS_WORKSPACE_PAT != 'true'
        run: echo "::notice::Set the CV_WORKSPACE_PAT repository secret to enable sync."

      - name: Checkout public repository
        if: env.HAS_WORKSPACE_PAT == 'true'
        uses: actions/checkout@v4
        with:
          path: destination

      - name: Check whether relevant private sources changed
        id: changes
        if: env.HAS_WORKSPACE_PAT == 'true'
        shell: bash
        env:
          WORKSPACE_PAT: ${{ secrets.CV_WORKSPACE_PAT }}
        run: |
          set -euo pipefail
          # Check commit metadata only. No private source files are downloaded.
          latest_commit() {
            local source_path="$1"
            curl --fail --silent --show-error --retry 2 \
              -H "Authorization: Bearer $WORKSPACE_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Antiokh/cv-workspace/commits?path=${source_path}&per_page=1" \
              | jq -er '.[0].sha'
          }
          public_sha="$(latest_commit public)"
          data_sha="$(latest_commit data/anton_nazarov_profile.json)"
          exporter_sha="$(latest_commit tools/export_public_cv.py)"
          fingerprint="$(printf '%s\n%s\n%s\n' "$public_sha" "$data_sha" "$exporter_sha" | sha256sum | cut -d' ' -f1)"
          echo "source_hash=$fingerprint" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "schedule" || ! -f destination/.sync-state ||
                "$(cat destination/.sync-state)" != "$fingerprint" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Source changed or manual run: rebuild required."
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No relevant private changes: skipping checkout and conversion."
          fi

      - name: Fetch private public directory without submodule processing
        if: env.HAS_WORKSPACE_PAT == 'true' && steps.changes.outputs.needed == 'true'
        shell: bash
        env:
          WORKSPACE_PAT: ${{ secrets.CV_WORKSPACE_PAT }}
        run: |
          set -euo pipefail
          # Pass credentials ephemerally; never store them in Git config or URLs.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WORKSPACE_PAT" | base64 -w0)"
          git clone --quiet --filter=blob:none --no-checkout --depth=1 --branch main \
            https://github.com/Antiokh/cv-workspace.git workspace
          git -C workspace sparse-checkout set --no-cone /public/ /data/anton_nazarov_profile.json /tools/export_public_cv.py
          git -C workspace checkout --quiet main
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 WORKSPACE_PAT

      - name: Validate and publish exactly public/
        if: env.HAS_WORKSPACE_PAT == 'true' && steps.changes.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f workspace/public/.publish-root
          test -f workspace/public/README.md
          test -s workspace/data/anton_nazarov_profile.json
          test -s workspace/tools/export_public_cv.py
          for name in GPT sources details data workflows .git; do
            test ! -e "workspace/public/$name" || { echo "Forbidden public path: $name"; exit 1; }
          done
          if find workspace/public -type l -print -quit | grep -q .; then
            echo "Symlinks are not permitted in public/"; exit 1
          fi
          rsync -a --delete --exclude='.git/' workspace/public/ destination/
          python3 workspace/tools/export_public_cv.py \
            --input workspace/data/anton_nazarov_profile.json --out destination
          python3 -m json.tool destination/resume.json > /dev/null
          python3 -m json.tool destination/person.jsonld > /dev/null
          printf '%s\n' "${{ steps.changes.outputs.source_hash }}" > destination/.sync-state
          cd destination
          git add --all
          if git diff --cached --quiet; then
            echo "Public CV already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync public CV from cv-workspace/public"
          git push origin HEAD:main
