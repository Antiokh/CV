name: One-shot Radio Hustle profile update

on:
  push:
    paths:
      - .github/workflows/one-shot-radiohustle-profile.yml

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/add-radiohustle-profile-20261014
          fetch-depth: 0

      - name: Update canonical profile JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/anton_nazarov_profile.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['profile_version'] = '2026-10-14'

          item = (
              'competitive Hustle / Discofox dancer; ASC #11713, verified Radio Hustle profile '
              '(D0 / RS0; E: 5; BG: 13 as of 2026-10-14): '
              'https://radiohustle.online/dancers/11713'
          )
          additional = data.setdefault('additional_experience', [])
          if item not in additional:
              additional.append(item)

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit profile update and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-radiohustle-profile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anton_nazarov_profile.json .github/workflows/one-shot-radiohustle-profile.yml
          git diff --cached --quiet || git commit -m "Add Radio Hustle dancer profile"
          git push origin HEAD:chore/add-radiohustle-profile-20261014
